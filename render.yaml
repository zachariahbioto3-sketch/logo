services:
  - type: web
    name: nicole
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nicole-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: UPLOADS_DIR
        value: /data/uploads
    disk:
      name: uploads
      mountPath: /data
      sizeGB: 1

databases:
  - name: nicole-db
    databaseName: nicole
    user: nicole
    plan: free